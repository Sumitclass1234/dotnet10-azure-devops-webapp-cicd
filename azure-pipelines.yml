
trigger:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - Agent.OS -equals Windows_NT

variables:
  buildConfiguration: 'Release'
  projectPath: 'WebApp/WebApp.csproj'
  publishFolder: '$(Build.ArtifactStagingDirectory)\publish'
  zipPath: '$(Build.ArtifactStagingDirectory)\WebApp.zip'

steps:

# 1. Install .NET 10 SDK
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

# 2. Display SDK Information
- task: PowerShell@2
  displayName: 'Check .NET SDK'
  inputs:
    targetType: 'inline'
    script: |
      dotnet --info
      dotnet --list-sdks

# 3. Restore NuGet Packages
- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: '$(projectPath)'

# 4. Build Application
- task: DotNetCoreCLI@2
  displayName: 'Build ASP.NET Core Web API'
  inputs:
    command: 'build'
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# 5. Clean Publish Directory
- task: PowerShell@2
  displayName: 'Clean Publish Directory'
  inputs:
    targetType: 'inline'
    script: |
      $publish = "$(publishFolder)"

      if (Test-Path $publish) {
          Remove-Item $publish -Recurse -Force
      }

      New-Item -ItemType Directory -Path $publish -Force

# 6. Publish Application
- task: DotNetCoreCLI@2
  displayName: 'Publish ASP.NET Core Web API'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --output "$(publishFolder)"'
    zipAfterPublish: false
    modifyOutputPath: false

# 7. Validate Publish Files
- task: PowerShell@2
  displayName: 'Validate Publish Directory'
  inputs:
    targetType: 'inline'
    script: |
      $publish = "$(publishFolder)"

      Write-Host "Checking published files..."

      Get-ChildItem $publish -Recurse | ForEach-Object {
          Write-Host $_.FullName
      }

      $requiredFiles = @(
          "WebApp.dll",
          "WebApp.deps.json",
          "WebApp.runtimeconfig.json",
          "web.config"
      )

      foreach ($file in $requiredFiles) {
          $path = Join-Path $publish $file

          if (!(Test-Path $path)) {
              throw "Required publish file missing: $file"
          }

          Write-Host "FOUND: $file"
      }

      Write-Host "SUCCESS: Publish validation completed."

# 8. Publish Pipeline Artifact
- task: PublishPipelineArtifact@1
  displayName: 'Publish Build Artifact'
  inputs:
    targetPath: '$(publishFolder)'
    artifact: 'WebApp-drop'
    publishLocation: 'pipeline'

# 9. Create Deployment ZIP
- task: PowerShell@2
  displayName: 'Create Deployment ZIP'
  inputs:
    targetType: 'inline'
    script: |
      $publish = "$(publishFolder)"
      $zip = "$(zipPath)"

      if (Test-Path $zip) {
          Remove-Item $zip -Force
      }

      Compress-Archive `
        -Path "$publish\*" `
        -DestinationPath $zip `
        -Force

      if (!(Test-Path $zip)) {
          throw "Deployment ZIP creation failed."
      }

      Write-Host "SUCCESS: Deployment ZIP created."
      Write-Host $zip

# 10. Validate ZIP Structure
- task: PowerShell@2
  displayName: 'Validate Deployment ZIP'
  inputs:
    targetType: 'inline'
    script: |
      Add-Type -AssemblyName System.IO.Compression.FileSystem

      $zip = "$(zipPath)"

      $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)

      try {
          $entries = @($archive.Entries | ForEach-Object {
              $_.FullName
          })

          Write-Host "ZIP CONTENTS:"
          $entries | ForEach-Object {
              Write-Host $_
          }

          foreach ($file in @("web.config", "WebApp.dll")) {
              if ($entries -notcontains $file) {
                  throw "ZIP validation failed: $file missing at root."
              }
          }

          Write-Host "SUCCESS: ZIP structure verified."
      }
      finally {
          $archive.Dispose()
      }

# 11. Deploy to Azure App Service
- task: AzureWebApp@1
  displayName: 'Deploy ASP.NET Core Web API'
  inputs:
    azureSubscription: 'sc-azure-subscription1'
    appType: 'webApp'
    appName: 'sumit-webapp-cicd-2026'
    package: '$(zipPath)'
    deploymentMethod: 'zipDeploy'
