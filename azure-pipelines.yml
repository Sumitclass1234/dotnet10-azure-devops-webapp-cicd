
trigger:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - Agent.OS -equals Windows_NT

variables:
  buildConfiguration: 'Release'
  projectPath: 'WebApp/WebApp.csproj'
  publishFolder: '$(Build.ArtifactStagingDirectory)\publish'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: '$(projectPath)'

- task: DotNetCoreCLI@2
  displayName: 'Build ASP.NET Core Web API'
  inputs:
    command: 'build'
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Publish ASP.NET Core Web API'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --output "$(publishFolder)" --no-build'
    zipAfterPublish: false

- task: PowerShell@2
  displayName: 'Validate Publish Directory'
  inputs:
    targetType: 'inline'
    script: |
      $source = "$(publishFolder)"

      Write-Host "Checking published files..."

      Get-ChildItem $source | ForEach-Object {
          Write-Host $_.Name
      }

      if (!(Test-Path "$source\web.config")) {
          throw "web.config missing from publish directory"
      }

      if (!(Test-Path "$source\WebApp.dll")) {
          throw "WebApp.dll missing from publish directory"
      }

      Write-Host "SUCCESS: Publish directory verified."

- task: PublishPipelineArtifact@1
  displayName: 'Publish Build Artifact'
  inputs:
    targetPath: '$(publishFolder)'
    artifact: 'WebApp-drop'
    publishLocation: 'pipeline'

- task: PowerShell@2
  displayName: 'Create Deployment ZIP'
  inputs:
    targetType: 'inline'
    script: |
      $source = "$(publishFolder)"
      $zip = "$(Build.ArtifactStagingDirectory)\WebApp.zip"

      if (Test-Path $zip) {
          Remove-Item $zip -Force
      }

      Compress-Archive -Path "$source\*" -DestinationPath $zip -Force

      Write-Host "Deployment ZIP created successfully."

- task: PowerShell@2
  displayName: 'Validate Deployment ZIP'
  inputs:
    targetType: 'inline'
    script: |
      Add-Type -AssemblyName System.IO.Compression.FileSystem

      $zipPath = "$(Build.ArtifactStagingDirectory)\WebApp.zip"
      $archive = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

      try {
          $entries = @($archive.Entries | ForEach-Object {
              $_.FullName
          })

          Write-Host "ZIP CONTENTS:"
          $entries | ForEach-Object {
              Write-Host $_
          }

          if ($entries -notcontains "web.config") {
              throw "web.config missing at ZIP root"
          }

          if ($entries -notcontains "WebApp.dll") {
              throw "WebApp.dll missing at ZIP root"
          }

          Write-Host "SUCCESS: Correct ZIP structure."
      }
      finally {
          $archive.Dispose()
      }

- task: AzureWebApp@1
  displayName: 'Deploy ASP.NET Core Web API'
  inputs:
    azureSubscription: 'sc-azure-subscription1'
    appType: 'webApp'
    appName: 'sumit-webapp-cicd-2026'
    package: '$(Build.ArtifactStagingDirectory)\WebApp.zip'
    deploymentMethod: 'zipDeploy'
