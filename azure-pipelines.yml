
trigger:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - Agent.OS -equals Windows_NT

variables:
  buildConfiguration: 'Release'
  projectPath: 'WebApp/WebApp.csproj'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET 8 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: '$(projectPath)'

- task: DotNetCoreCLI@2
  displayName: 'Build ASP.NET Core Web API'
  inputs:
    command: 'build'
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Publish Web API'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --output "$(Build.ArtifactStagingDirectory)\WebApp"'
    zipAfterPublish: false

- task: PublishPipelineArtifact@1
  displayName: 'Publish Build Artifact'
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)\WebApp'
    artifact: 'WebApp-drop'
    publishLocation: 'pipeline'

# Create deployment ZIP
- task: ArchiveFiles@2
  displayName: 'Create WebApp Deployment ZIP'
  inputs:
    rootFolderOrFile: '$(Build.ArtifactStagingDirectory)\WebApp'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)\WebApp.zip'
    replaceExistingArchive: true

# Deploy to Azure App Service
- task: AzureWebApp@1
  displayName: 'Deploy ASP.NET Core Web API'
  inputs:
    azureSubscription: 'sc-azure-subscription1'
    appType: 'webApp'
    appName: 'sumit-webapp-cicd-2026'
    package: '$(Build.ArtifactStagingDirectory)\WebApp.zip'
    deploymentMethod: 'zipDeploy'

