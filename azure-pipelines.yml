
trigger:
  branches:
    include:
      - main

pool:
  name: Default
  demands:
    - Agent.OS -equals Windows_NT

variables:
  buildConfiguration: 'Release'
  projectPath: 'WebApp/WebApp.csproj'
  publishFolder: '$(Build.ArtifactStagingDirectory)\WebApp'

steps:
- task: UseDotNet@2
  displayName: 'Install .NET 10 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore NuGet Packages'
  inputs:
    command: 'restore'
    projects: '$(projectPath)'

- task: DotNetCoreCLI@2
  displayName: 'Build ASP.NET Core Web API'
  inputs:
    command: 'build'
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Publish ASP.NET Core Web API'
  inputs:
    command: 'publish'
    publishWebProjects: false
    projects: '$(projectPath)'
    arguments: '--configuration $(buildConfiguration) --output "$(publishFolder)" --no-build'
    zipAfterPublish: false

- task: PublishPipelineArtifact@1
  displayName: 'Publish Build Artifact'
  inputs:
    targetPath: '$(publishFolder)'
    artifact: 'WebApp-drop'
    publishLocation: 'pipeline'

- task: ArchiveFiles@2
  displayName: 'Create WebApp Deployment ZIP'
  inputs:
    rootFolderOrFile: '$(publishFolder)'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)\WebApp.zip'
    replaceExistingArchive: true

- task: PowerShell@2
  displayName: 'Validate Deployment ZIP Structure'
  inputs:
    targetType: 'inline'
    script: |
      Add-Type -AssemblyName System.IO.Compression.FileSystem

      $zipPath = "$(Build.ArtifactStagingDirectory)\WebApp.zip"

      $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)

      try {
          $entries = $zip.Entries | ForEach-Object {
              $_.FullName
          }

          Write-Host "Deployment ZIP contents:"
          $entries | ForEach-Object {
              Write-Host $_
          }

          if ($entries -notcontains "web.config") {
              throw "ERROR: web.config is not at ZIP root!"
          }

          if ($entries -notcontains "WebApp.dll") {
              throw "ERROR: WebApp.dll is not at ZIP root!"
          }

          Write-Host "SUCCESS: ZIP structure is correct."
      }
      finally {
          $zip.Dispose()
      }


- task: AzureWebApp@1
  displayName: 'Deploy ASP.NET Core Web API'
  inputs:
    azureSubscription: 'sc-azure-subscription1'
    appType: 'webApp'
    appName: 'sumit-webapp-cicd-2026'
    package: '$(Build.ArtifactStagingDirectory)\WebApp.zip'
    deploymentMethod: 'zipDeploy'
